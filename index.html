
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>MH AI - AI Without Limits</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 font-family:Arial,sans-serif;
 background:#f7f9fd;
 color:#172b4d;
}
header{
 min-height:65px;
 background:white;
 border-bottom:1px solid #e7edf5;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:10px 18px;
 position:sticky;
 top:0;
 z-index:5;
 gap:10px;
}
.logo{font-size:25px;font-weight:800;color:#1768d5}
.logo span{color:#20a5ee}
.actions{display:flex;gap:8px;align-items:center}
button,select{cursor:pointer;font-size:14px}
.login{
 background:white;border:1px solid #1768d5;
 color:#1768d5;padding:10px 13px;border-radius:9px
}
.signup{
 background:#1768d5;color:white;border:0;
 padding:10px 13px;border-radius:9px
}
main{max-width:850px;margin:35px auto;padding:15px}
.hero{text-align:center;margin:40px 0}
.hero h1{font-size:34px;margin-bottom:12px}
.hero h1 span{color:#1768d5}
.hero p{color:#718096;line-height:1.6}
.tools{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:12px;margin:30px 0
}
.tool{
 background:white;border:1px solid #e5eaf2;
 border-radius:15px;padding:18px 8px;
 text-align:center;cursor:pointer;transition:.2s
}
.tool:hover,.tool.active{
 border-color:#1768d5;
 background:#f0f6ff;
 transform:translateY(-2px)
}
.emoji{font-size:25px;margin-bottom:10px}
.tool b{font-size:13px}
.messages{
 margin:20px 0;display:flex;
 flex-direction:column;gap:12px
}
.msg{
 padding:13px 16px;border-radius:13px;
 max-width:95%;line-height:1.6;
 white-space:pre-wrap;overflow-wrap:anywhere
}
.user{align-self:flex-end;background:#e7f1ff}
.bot{align-self:flex-start;background:white;border:1px solid #e5eaf2}
.chatbox{
 background:white;border:1px solid #e0e7f1;
 border-radius:18px;padding:15px;
 box-shadow:0 8px 30px #193b650a
}
.chatbox textarea{
 width:100%;height:75px;border:0;
 outline:none;resize:vertical;font-size:16px;
 font-family:inherit
}
.chatbottom{
 display:flex;justify-content:space-between;
 align-items:center;gap:10px
}
.send{
 background:#1768d5;color:white;border:0;
 border-radius:10px;padding:12px 20px
}
.send:disabled{opacity:.6;cursor:not-allowed}
.footer{
 text-align:center;color:#8b98aa;
 font-size:12px;margin:30px 0;line-height:1.8
}
select{
 border:1px solid #e0e7f1;border-radius:8px;
 padding:9px;background:white;color:#334
}
.status{text-align:center;font-size:12px;color:#718096;margin-top:10px}
@media(max-width:550px){
 .hero h1{font-size:27px}
 .tools{grid-template-columns:repeat(2,1fr)}
 main{margin:15px auto}
 header{padding:10px}
 .login,.signup{padding:9px}
 select{max-width:105px}
}
</style>
</head>

<body>

<header>
 <div class="logo">MH <span>AI</span></div>

 <div class="actions">
  <select id="language" onchange="changeLanguage()">
   <option value="en">English</option>
   <option value="bn">বাংলা</option>
   <option value="hi">हिन्दी</option>
   <option value="ar">العربية</option>
   <option value="es">Español</option>
  </select>
  <button class="login" onclick="alert('Login system coming soon!')">Login</button>
  <button class="signup" onclick="alert('Signup system coming soon!')">Sign Up</button>
 </div>
</header>

<main>

 <section class="hero">
  <h1 id="heading">Welcome to <span>MH AI</span></h1>
  <p id="subtitle">Your intelligent AI assistant. Ask anything and explore new possibilities.</p>
 </section>

 <section class="tools">
  <div class="tool active" onclick="setTool('Chat',this)">
   <div class="emoji">💬</div><b>AI Chat</b>
  </div>
  <div class="tool" onclick="setTool('Image',this)">
   <div class="emoji">🎨</div><b>AI Image</b>
  </div>
  <div class="tool" onclick="setTool('Video',this)">
   <div class="emoji">🎬</div><b>AI Video</b>
  </div>
  <div class="tool" onclick="setTool('Coding',this)">
   <div class="emoji">💻</div><b>AI Coding</b>
  </div>
 </section>

 <section class="messages" id="messages">
  <div class="msg bot">
   Hello! 👋 I am MH AI. How can I help you today?
  </div>
 </section>

 <section class="chatbox">
  <textarea id="prompt" placeholder="Ask MH AI anything..." onkeydown="handleEnter(event)"></textarea>

  <div class="chatbottom">
   <span style="font-size:12px;color:#8492a6" id="mode">✨ AI Chat</span>
   <button class="send" id="sendButton" onclick="sendMessage()">Send ↑</button>
  </div>
  <div class="status" id="status">MH AI is ready</div>
 </section>

 <div class="footer">
  © 2026 MH AI. All rights reserved.<br>
  One AI. Unlimited Possibilities.
 </div>

</main>

<script>
const API_URL = "https://mh-ai-jobh.onrender.com/api/chat";

let currentTool = "Chat";
let conversationHistory = [];

function setTool(tool, element){
 currentTool = tool;

 document.querySelectorAll(".tool").forEach(item=>{
  item.classList.remove("active");
 });

 if(element) element.classList.add("active");

 document.getElementById("mode").innerText = "✨ AI " + tool;

 const placeholders = {
  Chat:"Ask MH AI anything...",
  Image:"Describe an image you want to create...",
  Video:"Describe a video you want to create...",
  Coding:"Ask MH AI to write or explain code..."
 };

 document.getElementById("prompt").placeholder =
 placeholders[tool] || placeholders.Chat;

 document.getElementById("prompt").focus();
}

function addMessage(text, type){
 const messages = document.getElementById("messages");
 const div = document.createElement("div");
 div.className = "msg " + type;
 div.textContent = text;
 messages.appendChild(div);
 return div;
}

function handleEnter(event){
 if(event.key === "Enter" && !event.shiftKey){
  event.preventDefault();
  sendMessage();
 }
}

async function sendMessage(){
 const input = document.getElementById("prompt");
 const button = document.getElementById("sendButton");
 const status = document.getElementById("status");

 const value = input.value.trim();
 if(!value) return;

 addMessage(value,"user");
 input.value = "";

 const bot = addMessage("MH AI is thinking...","bot");

 button.disabled = true;
 button.textContent = "Thinking...";
 status.textContent = "Connecting to MH AI server...";

 try{
  const response = await fetch(API_URL,{
   method:"POST",
   headers:{
    "Content-Type":"application/json"
   },
   body:JSON.stringify({
    message: value,
    tool: currentTool,
    history: conversationHistory
   })
  });

  let data;
  try{
   data = await response.json();
  }catch{
   throw new Error("Server returned an invalid response.");
  }

  if(!response.ok){
   throw new Error(data.error || "Server error: " + response.status);
  }

  const answer =
   data.reply ||
   data.output_text ||
   data.answer ||
   data.message;

  if(typeof answer !== "string" || !answer.trim()){
   throw new Error("AI response was empty. Check server.js response format.");
  }

  bot.textContent = answer;

  conversationHistory.push(
   {role:"user",content:value},
   {role:"assistant",content:answer}
  );

  // Keep recent context limited
  if(conversationHistory.length > 20){
   conversationHistory = conversationHistory.slice(-20);
  }

  status.textContent = "MH AI is ready";

 }catch(error){
  bot.textContent = "দুঃখিত! সমস্যা হয়েছে:\n" + error.message;
  status.textContent = "Connection problem";
 }finally{
  button.disabled = false;
  button.textContent = "Send ↑";
  window.scrollTo(0,document.body.scrollHeight);
 }
}

function changeLanguage(){
 const lang = document.getElementById("language").value;

 const translations = {
  en:[
   "Welcome to <span>MH AI</span>",
   "Your intelligent AI assistant. Ask anything and explore new possibilities."
  ],
  bn:[
   "<span>MH AI</span>-তে স্বাগতম",
   "আপনার বুদ্ধিমান AI সহকারী। যেকোনো প্রশ্ন করুন।"
  ],
  hi:[
   "<span>MH AI</span> में आपका स्वागत है",
   "आपका बुद्धिमान AI सहायक। कुछ भी पूछें।"
  ],
  ar:[
   "مرحباً بك في <span>MH AI</span>",
   "مساعدك الذكي. اسأل أي شيء."
  ],
  es:[
   "Bienvenido a <span>MH AI</span>",
   "Tu asistente inteligente de IA. Pregunta lo que quieras."
  ]
 };

 document.getElementById("heading").innerHTML =
  translations[lang][0];

 document.getElementById("subtitle").textContent =
  translations[lang][1];

 document.documentElement.lang = lang;
}
</script>

</body>
</html>
